name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
    
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"


jobs:
  backend:
    name: Lint + migrate + test
    runs-on: ubuntu-latest


    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dalia_db
        ports:
          - 3306:3306
        
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    defaults:
      run:
        working-directory: backend
    
    env:
      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/dalia_db
    
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      
      - name: Install Python
        run: uv python install
      
      - name: Sync dependencies
        run: uv sync --frozen
      
      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run Alembic migrations against MySQL
        run: uv run alembic upgrade head

      # - name: Run tests
      #   run: uv run pytest -q


